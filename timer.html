<!-- src/modules/TimerCo.vue -->
<script setup>
import { ref, computed, watch, onMounted, onUnmounted } from 'vue';
import { initializeApp, getApps } from 'firebase/app';
import { getDatabase, ref as dbRef, set, onValue, off } from 'firebase/database';

// Props allow Mission Control to pass the active Event ID and toggle 2x2 Quad-View layout
const props = defineProps({
  eventId: { type: String, default: 'demo_sandbox' },
  isEmbedded: { type: Boolean, default: false }
});

const emit = defineEmits(['timer-alert']);

// --- 1. CONNECT TO YOUR EXISTING STAGETIMERCO REALTIME DB ---
const timerFirebaseConfig = {
  apiKey: "AIzaSyAa_eku03NFVS-BuORZk-LrhHYenliOc2U",
  authDomain: "stagetimerco.firebaseapp.com",
  databaseURL: "https://stagetimerco-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stagetimerco",
  storageBucket: "stagetimerco.firebasestorage.app",
  messagingSenderId: "509616370775",
  appId: "1:509616370775:web:7e7750d74fc30c739f1f12"
};

// Initialize as a named secondary Firebase app so it never clashes with your Auth Firebase app!
const timerApp = getApps().find(a => a.name === 'timerCoApp') || initializeApp(timerFirebaseConfig, 'timerCoApp');
const rtdb = getDatabase(timerApp);

// --- 2. REACTIVE TIMER STATE ---
const status = ref('stopped');
const targetTimestamp = ref(0);
const pausedRemaining = ref(0);
const now = ref(Date.now());

const speakerName = ref('');
const draftMessage = ref('');
const activeMessage = ref('');
const copyText = ref('COPY DSM LINK');

let ticker = null;
let activeTimerRef = null;
let lastAlertedSecond = null;

// --- 3. CLOUD SYNC ENGINE (Refresh-Safe!) ---
const syncToCloud = () => {
  if (!activeTimerRef) return;
  set(activeTimerRef, {
    status: status.value,
    targetTimestamp: targetTimestamp.value,
    pausedRemaining: pausedRemaining.value,
    speakerName: speakerName.value,
    activeMessage: activeMessage.value
  });
};

const connectToEventRoom = (evtId) => {
  if (activeTimerRef) off(activeTimerRef);
  activeTimerRef = dbRef(rtdb, `timers/${evtId}`);

  // Listen to existing DB state first (prevents F5 refresh from wiping a live show!)
  onValue(activeTimerRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      status.value = data.status || 'stopped';
      targetTimestamp.value = data.targetTimestamp || 0;
      pausedRemaining.value = data.pausedRemaining || 0;
      speakerName.value = data.speakerName || '';
      activeMessage.value = data.activeMessage || '';
    }
  });
};

watch(() => props.eventId, (newId) => {
  connectToEventRoom(newId || 'demo_sandbox');
}, { immediate: true });

// --- 4. TIME & OVERTIME MATH ---
const remainingSeconds = computed(() => {
  if (status.value === 'stopped') return 0;
  if (status.value === 'paused') return pausedRemaining.value;
  return Math.ceil((targetTimestamp.value - now.value) / 1000);
});

const formattedTime = computed(() => {
  const totalSecs = remainingSeconds.value;
  const isNegative = totalSecs < 0;
  const absSecs = Math.abs(totalSecs);

  const hours = Math.floor(absSecs / 3600);
  const minutes = Math.floor((absSecs % 3600) / 60);
  const seconds = absSecs % 60;

  const timeStr = hours > 0
    ? `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`
    : `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

  return isNegative ? `-${timeStr}` : timeStr;
});

// Fire cross-app alerts to SignalCo when hitting 60s warning or 0s overtime
watch(remainingSeconds, (sec) => {
  if (status.value !== 'running') return;
  if (sec === 60 && lastAlertedSecond !== 60) {
    lastAlertedSecond = 60;
    emit('timer-alert', { level: 'warn', msg: `⚠️ TIMERCO: 1 Minute Remaining (${speakerName.value || 'Session'})` });
  } else if (sec === 0 && lastAlertedSecond !== 0) {
    lastAlertedSecond = 0;
    emit('timer-alert', { level: 'crit', msg: `🚨 TIMERCO: Speaker is OVERTIME (${speakerName.value || 'Session'})` });
  }
});

// --- 5. OPERATOR CONTROLS ---
const startTimer = () => {
  if (status.value === 'running') return;
  if (status.value === 'paused') {
    targetTimestamp.value = Date.now() + (pausedRemaining.value * 1000);
  } else if (targetTimestamp.value === 0) {
    targetTimestamp.value = Date.now() + (300 * 1000);
  }
  status.value = 'running';
  syncToCloud();
};

const pauseTimer = () => {
  if (status.value !== 'running') return;
  pausedRemaining.value = remainingSeconds.value;
  status.value = 'paused';
  syncToCloud();
};

const resetTimer = () => {
  status.value = 'stopped';
  targetTimestamp.value = 0;
  pausedRemaining.value = 0;
  lastAlertedSecond = null;
  syncToCloud();
};

const adjustTime = (secondsToAdd) => {
  if (status.value === 'running') {
    targetTimestamp.value += (secondsToAdd * 1000);
  } else {
    const current = status.value === 'paused' ? pausedRemaining.value : 0;
    pausedRemaining.value = Math.max(0, current + secondsToAdd);
    status.value = 'paused';
  }
  syncToCloud();
};

const setPreset = (totalSeconds) => {
  lastAlertedSecond = null;
  if (status.value === 'running') {
    targetTimestamp.value = Date.now() + (totalSeconds * 1000);
  } else {
    pausedRemaining.value = totalSeconds;
    status.value = 'paused';
  }
  syncToCloud();
};

const flashMessage = () => {
  if (!draftMessage.value.trim()) return;
  activeMessage.value = draftMessage.value;
  draftMessage.value = '';
  syncToCloud();
};

const clearMessage = () => {
  activeMessage.value = '';
  syncToCloud();
};

const copyDsmLink = () => {
  const stagingUrl = `${window.location.origin}/dsm.html?event=${props.eventId}`;
  navigator.clipboard.writeText(stagingUrl).then(() => {
    copyText.value = 'COPIED!';
    setTimeout(() => { copyText.value = 'COPY DSM LINK'; }, 2000);
  });
};

const popOutDsmWindow = () => {
  window.open(`/dsm.html?event=${props.eventId}`, '_blank', 'width=1280,height=720');
};

onMounted(() => {
  ticker = setInterval(() => { now.value = Date.now(); }, 100);
});

onUnmounted(() => {
  clearInterval(ticker);
  if (activeTimerRef) off(activeTimerRef);
});
</script>

<template>
  <div class="h-full w-full flex flex-col bg-black text-slate-200 overflow-hidden select-none">
    <!-- HEADER (Hidden or compact when embedded in 2x2 Quad-View) -->
    <header class="border-b border-white/10 px-5 py-2.5 flex justify-between items-center bg-[#0b0b0b] shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_10px_#3b82f6]"></div>
        <h1 class="font-black tracking-widest uppercase" :class="isEmbedded ? 'text-xs' : 'text-lg'">
          <span class="text-white">Timer</span><span class="text-blue-500">Co</span>
          <span class="text-slate-500 text-xs ml-2 font-mono">// {{ eventId }}</span>
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <button @click="copyDsmLink" class="text-[10px] bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded font-bold tracking-wider transition">
          {{ copyText }}
        </button>
        <button @click="popOutDsmWindow" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1 rounded font-bold border border-white/10 transition">
          ↗ POP-OUT DSM
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT GRID -->
    <main class="flex-1 grid gap-4 p-4 overflow-hidden min-h-0" :class="isEmbedded ? 'grid-cols-12' : 'grid-cols-1 lg:grid-cols-12 p-6 gap-6'">
      
      <!-- LEFT CONTROLS -->
      <div class="col-span-5 flex flex-col gap-3 overflow-y-auto pr-1 min-h-0">
        <!-- Playback -->
        <section class="panel-raised p-4 rounded-xl">
          <div class="grid grid-cols-2 gap-2 mb-2">
            <button @click="startTimer" :disabled="status === 'running'"
                    :class="status === 'running' ? 'opacity-40 cursor-not-allowed bg-emerald-900/30 text-emerald-600' : 'bg-emerald-600 hover:bg-emerald-500 text-white'"
                    class="py-2.5 rounded font-black tracking-wider text-xs uppercase transition">
              Start / Resume
            </button>
            <button @click="pauseTimer" :disabled="status !== 'running'"
                    :class="status !== 'running' ? 'opacity-40 cursor-not-allowed bg-slate-800 text-slate-600' : 'bg-yellow-600 hover:bg-yellow-500 text-white'"
                    class="py-2.5 rounded font-black tracking-wider text-xs uppercase transition">
              Pause
            </button>
          </div>
          <button @click="resetTimer" class="w-full py-1.5 bg-black border border-white/10 hover:bg-red-950/40 hover:text-red-400 text-slate-400 rounded font-bold text-[11px] uppercase transition">
            Hard Reset to Zero
          </button>
        </section>

        <!-- Time Adjustments & Presets -->
        <section class="panel-raised p-4 rounded-xl">
          <div class="grid grid-cols-4 gap-1.5 mb-3">
            <button @click="adjustTime(-60)" class="py-1.5 bg-black border border-white/10 hover:bg-slate-800 rounded font-tech text-xs text-slate-300">-1m</button>
            <button @click="adjustTime(60)" class="py-1.5 bg-black border border-white/10 hover:bg-slate-800 rounded font-tech text-xs text-slate-300">+1m</button>
            <button @click="adjustTime(300)" class="py-1.5 bg-black border border-white/10 hover:bg-slate-800 rounded font-tech text-xs text-slate-300">+5m</button>
            <button @click="adjustTime(600)" class="py-1.5 bg-black border border-white/10 hover:bg-slate-800 rounded font-tech text-xs text-slate-300">+10m</button>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <button @click="setPreset(300)" class="py-2 bg-slate-800 hover:bg-blue-600 hover:text-white rounded font-tech font-bold text-xs text-slate-300">5:00</button>
            <button @click="setPreset(900)" class="py-2 bg-slate-800 hover:bg-blue-600 hover:text-white rounded font-tech font-bold text-xs text-slate-300">15:00</button>
            <button @click="setPreset(2700)" class="py-2 bg-slate-800 hover:bg-blue-600 hover:text-white rounded font-tech font-bold text-xs text-slate-300">45:00</button>
          </div>
        </section>

        <!-- Speaker & Stage Messaging -->
        <section class="panel-raised p-4 rounded-xl flex-1 flex flex-col gap-2">
          <input type="text" v-model="speakerName" @change="syncToCloud" placeholder="Speaker Name (e.g. Dr. Jane Smith)"
                 class="w-full bg-[#050505] border border-white/10 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
          <div class="relative flex-1 flex flex-col">
            <textarea v-model="draftMessage" rows="2" placeholder="Flash message on DSM..."
                      class="w-full flex-1 bg-[#050505] border border-white/10 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-yellow-500 resize-none"></textarea>
            <div class="flex justify-between items-center mt-2">
              <button v-if="activeMessage" @click="clearMessage" class="text-[10px] text-red-400 hover:text-red-300 uppercase font-bold">
                ✕ Clear Active Alert
              </button>
              <span v-else></span>
              <button @click="flashMessage" :class="draftMessage ? 'bg-yellow-600 hover:bg-yellow-500 text-white' : 'bg-slate-800 text-slate-600 cursor-not-allowed'"
                      class="px-3 py-1 rounded font-bold uppercase text-[10px] transition">
                Flash to Stage
              </button>
            </div>
          </div>
        </section>
      </div>

      <!-- RIGHT LIVE DSM PREVIEW -->
      <div class="col-span-7 flex flex-col h-full min-h-0">
        <div class="panel-raised rounded-xl shadow-2xl flex-1 flex flex-col items-center justify-center p-6 relative overflow-hidden stage-display"
             :class="[
               status === 'running' && remainingSeconds <= 0 ? 'state-overtime' : '',
               status === 'running' && remainingSeconds > 0 && remainingSeconds <= 60 ? 'state-warning' : '',
               status === 'running' && remainingSeconds > 60 ? 'state-running' : '',
               status === 'paused' || status === 'stopped' ? 'state-paused' : ''
             ]">
          <div class="absolute top-6 font-black tracking-widest uppercase opacity-80 text-center px-4 truncate max-w-full"
               :class="isEmbedded ? 'text-sm top-4' : 'text-2xl top-10'">
            {{ speakerName || 'SESSION TIMER' }}
          </div>

          <div class="font-tech font-bold leading-none tracking-tighter"
               :class="isEmbedded ? 'text-6xl xl:text-7xl' : 'text-[10vw]'">
            {{ formattedTime }}
          </div>

          <div v-if="activeMessage"
               class="absolute bottom-6 bg-yellow-500 text-black px-5 py-2 rounded-xl font-black uppercase tracking-wider shadow-[0_0_30px_rgba(234,179,8,0.5)] animate-bounce text-center max-w-[90%]"
               :class="isEmbedded ? 'text-xs bottom-3' : 'text-2xl bottom-12'">
            {{ activeMessage }}
          </div>
        </div>
      </div>

    </main>
  </div>
</template>

<style scoped>
.panel-raised { background-color: #1a1a1a; border: 1px solid rgba(255, 255, 255, 0.1); }
.font-tech { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
.stage-display { transition: all 0.3s ease; }
.state-running { color: #ffffff; text-shadow: 0 0 40px rgba(255,255,255,0.1); }
.state-warning { color: #eab308; text-shadow: 0 0 60px rgba(234,179,8,0.2); }
.state-overtime { color: #ef4444; text-shadow: 0 0 60px rgba(239,68,68,0.4); animation: pulse-red 2s infinite; }
.state-paused { color: #64748b; }
@keyframes pulse-red {
  0%, 100% { background-color: #050505; }
  50% { background-color: #1a0505; }
}
</style>
